<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าครั้งแรก - ระบบจัดการสต๊อกผ้าม่าน</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Kanit',sans-serif;background:linear-gradient(180deg,#4fc3f7,#0277bd);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border-radius:24px;padding:40px;max-width:480px;width:100%;box-shadow:0 25px 80px rgba(0,0,0,.2)}
    h1{font-size:24px;font-weight:600;margin-bottom:8px;color:#1d1d1f}
    .sub{color:#6e6e73;font-size:14px;margin-bottom:24px}
    .step{background:#f5f5f7;border-radius:12px;padding:16px;margin-bottom:16px;font-size:14px;color:#1d1d1f;line-height:1.6}
    .step b{color:#0277bd}
    label{display:block;font-size:13px;font-weight:500;margin:16px 0 6px;color:#1d1d1f}
    input,select{width:100%;padding:12px 14px;border:1px solid #d2d2d7;border-radius:10px;font-family:inherit;font-size:15px}
    button{width:100%;padding:14px;background:linear-gradient(135deg,#4fc3f7,#0288d1);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:16px;font-weight:600;margin-top:24px;cursor:pointer}
    button:hover{opacity:.9}
    button:disabled{opacity:.5;cursor:not-allowed}
    .msg{margin-top:16px;padding:12px 16px;border-radius:10px;font-size:14px;display:none}
    .msg.ok{background:#e8f8ee;color:#1a7f37;display:block}
    .msg.err{background:#fdecea;color:#c62828;display:block}
    .warn{background:#fff8e1;color:#8a6d00;border-radius:12px;padding:14px;font-size:13px;line-height:1.6;margin-bottom:20px}
    code{background:#e8e8ed;padding:2px 6px;border-radius:4px;font-size:13px}
  </style>
</head>
<body>
  <div class="card">
    <h1>🔧 ตั้งค่าครั้งแรก</h1>
    <p class="sub">สร้างบัญชีผู้ดูแลระบบ (Admin) คนแรก</p>

    <div class="warn">
      ⚠️ <b>ใช้หน้านี้เฉพาะตอนตั้งค่าครั้งแรกเท่านั้น</b><br>
      หลังสร้าง admin เสร็จแล้ว ควรลบไฟล์ <code>setup.html</code> ออกจาก GitHub เพื่อความปลอดภัย
    </div>

    <div class="step">
      ก่อนใช้หน้านี้ ต้องแก้ค่า <b>firebaseConfig</b> ในไฟล์ <code>setup.html</code> และ <code>index.html</code> ให้เป็นของคุณก่อน (ดูขั้นตอนใน README.md)
    </div>

    <label>ชื่อผู้ใช้ (username)</label>
    <input type="text" id="username" placeholder="เช่น admin" value="admin">

    <label>ชื่อที่แสดง (displayName)</label>
    <input type="text" id="displayName" placeholder="เช่น ผู้ดูแลระบบ" value="ผู้ดูแลระบบ">

    <label>รหัสผ่าน</label>
    <input type="password" id="password" placeholder="ตั้งรหัสผ่าน">

    <label>สาขา</label>
    <input type="text" id="branch" placeholder="เช่น สำนักงานใหญ่" value="สำนักงานใหญ่">

    <label>สิทธิ์</label>
    <select id="role">
      <option value="admin">admin (ผู้ดูแลระบบ)</option>
      <option value="staff">staff (พนักงาน)</option>
      <option value="sales">sales (ขาย)</option>
    </select>

    <button id="createBtn" onclick="createUser()">สร้างบัญชี</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    // ⚠️ ใส่ค่าเดียวกับ index.html
    const firebaseConfig = {
      apiKey: "AIzaSyAA0nq7NhL-yyrwXMK8NP42rQ-coYUR6u0",
      authDomain: "stock-manager-2026.firebaseapp.com",
      databaseURL: "https://stock-manager-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "stock-manager-2026",
      storageBucket: "stock-manager-2026.firebasestorage.app",
      messagingSenderId: "10544854273",
      appId: "1:10544854273:web:6b43b59eb6be89d3ad1700"
    };

    if (firebaseConfig.apiKey === "YOUR_API_KEY") {
      alert("⚠️ ยังไม่ได้ตั้งค่า Firebase ในไฟล์ setup.html\nกรุณาแก้ firebaseConfig ก่อน");
    }

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ต้องเหมือน hashPassword ใน index.html ทุกตัวอักษร
    function hashPassword(password) {
      var str = password + '_salt_meidea';
      var hash = 0;
      for (var i = 0; i < str.length; i++) {
        var char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return 'H' + Math.abs(hash).toString(36) + 'X' + str.length;
    }

    function createUser() {
      var username = document.getElementById('username').value.trim();
      var displayName = document.getElementById('displayName').value.trim();
      var password = document.getElementById('password').value;
      var branch = document.getElementById('branch').value.trim();
      var role = document.getElementById('role').value;
      var msg = document.getElementById('msg');
      var btn = document.getElementById('createBtn');

      if (!username || !password || !displayName) {
        msg.className = 'msg err';
        msg.textContent = 'กรุณากรอกชื่อผู้ใช้ ชื่อที่แสดง และรหัสผ่านให้ครบ';
        return;
      }

      btn.disabled = true;
      msg.className = 'msg';
      msg.textContent = '';

      var newUser = {
        username: username,
        password: hashPassword(password),
        displayName: displayName,
        role: role,
        branch: branch,
        active: true
      };

      db.ref('users/' + username).set(newUser).then(function() {
        msg.className = 'msg ok';
        msg.innerHTML = '✅ สร้างบัญชีสำเร็จ! เข้าใช้งานได้ที่ <b>index.html</b><br>username: <b>' + username + '</b>';
        btn.disabled = false;
      }).catch(function(err) {
        msg.className = 'msg err';
        msg.textContent = '❌ เกิดข้อผิดพลาด: ' + err.message + ' (ตรวจสอบว่า Firebase Rules อนุญาต write และ config ถูกต้อง)';
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
